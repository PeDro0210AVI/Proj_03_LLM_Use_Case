[package]
name = "corpo-metrics-chatbot"
version = "0.1.0"
edition = "2021"
description = "A terminal UI chat client for the Claude API, wired to a remote MCP server."
license = "MIT"

[[bin]]
name = "corpo-metrics-chatbot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
ratatui = "0.29"
crossterm = "0.28"
textwrap = "0.16"
rmcp = { version = "3", features = ["client", "transport-child-process"] }
